<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cb85c"/>
      <stop offset="0.55" stop-color="#3aa564"/>
      <stop offset="1" stop-color="#23703f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#f6c945" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f6c945" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f9c8"/>
      <stop offset="1" stop-color="#d6ec8a"/>
    </linearGradient>
  </defs>
  <!-- Fond plein (l'OS arrondit les coins lui-même) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sun)"/>
  <!-- Avocat, centré dans la zone de sécurité (≈ 60 % du carré) -->
